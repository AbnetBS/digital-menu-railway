      <stop offset="0%" stop-color="#3D2314" />
      <stop offset="100%" stop-color="#22120C" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C64D" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <circle cx="200" cy="110" r="55" fill="#2C1B17" stroke="#C9A227" stroke-width="2" stroke-opacity="0.4" />
